<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockGuard - Enterprise Employee Directory & Security</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- React 18, React-DOM, and Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE_URL = 'http://127.0.0.1:8000';

    const ROLES = [
      { value: 'admin', label: 'Administrator', badge: 'bg-purple-500/10 text-purple-400 border-purple-500/30' },
      { value: 'manager', label: 'Inventory Manager', badge: 'bg-blue-500/10 text-blue-400 border-blue-500/30' },
      { value: 'warehouse_staff', label: 'Warehouse Staff', badge: 'bg-amber-500/10 text-amber-400 border-amber-500/30' },
      { value: 'delivery_agent', label: 'Delivery Agent', badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' }
    ];

    function App() {
      const [token, setToken] = useState(localStorage.getItem('sg_token'));
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('sg_user'));
        } catch {
          return null;
        }
      });

      // Login form state
      const [loginEmail, setLoginEmail] = useState('admin@stockguard.test');
      const [loginPassword, setLoginPassword] = useState('Password123!');
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState(null);

      // Users and warehouses state
      const [users, setUsers] = useState([]);
      const [warehouses, setWarehouses] = useState([]);
      const [loadingUsers, setLoadingUsers] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [roleFilter, setRoleFilter] = useState('');
      const [warehouseFilter, setWarehouseFilter] = useState('');

      // Modals
      const [showAddModal, setShowAddModal] = useState(false);
      const [resetTargetUser, setResetTargetUser] = useState(null);
      const [showChangePasswordModal, setShowChangePasswordModal] = useState(false);
      const [showUserDropdown, setShowUserDropdown] = useState(false);
      const [toast, setToast] = useState(null);

      // Forms
      const [addForm, setAddForm] = useState({
        name: '',
        email: '',
        password: '',
        role: 'warehouse_staff',
        warehouse_id: ''
      });
      const [addError, setAddError] = useState(null);
      const [addSubmitting, setAddSubmitting] = useState(false);

      const [resetPasswordVal, setResetPasswordVal] = useState('');
      const [resetError, setResetError] = useState(null);
      const [resetSubmitting, setResetSubmitting] = useState(false);

      const [cpOldPass, setCpOldPass] = useState('');
      const [cpNewPass, setCpNewPass] = useState('');
      const [cpConfirmPass, setCpConfirmPass] = useState('');
      const [cpError, setCpError] = useState(null);
      const [cpSubmitting, setCpSubmitting] = useState(false);

      const triggerToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginLoading(true);
        setLoginError(null);

        try {
          const body = new URLSearchParams();
          body.append('username', loginEmail);
          body.append('password', loginPassword);

          const res = await fetch(`${API_BASE_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: body.toString()
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Login failed');

          localStorage.setItem('sg_token', data.access_token);
          const u = {
            email: data.email,
            name: data.name,
            role: data.role,
            warehouse_id: data.warehouse_id
          };
          localStorage.setItem('sg_user', JSON.stringify(u));
          setToken(data.access_token);
          setCurrentUser(u);
          triggerToast(`Welcome back, ${data.name}!`);
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setLoginLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('sg_token');
        localStorage.removeItem('sg_user');
        setToken(null);
        setCurrentUser(null);
        setUsers([]);
      };

      const fetchDirectory = async () => {
        if (!token) return;
        setLoadingUsers(true);
        try {
          const query = new URLSearchParams();
          if (roleFilter) query.append('role', roleFilter);
          if (warehouseFilter) query.append('warehouse_id', warehouseFilter);

          const qStr = query.toString();
          const [uRes, whRes] = await Promise.all([
            fetch(`${API_BASE_URL}/users${qStr ? `?${qStr}` : ''}`, {
              headers: { Authorization: `Bearer ${token}` }
            }),
            fetch(`${API_BASE_URL}/warehouse/warehouse`, {
              headers: { Authorization: `Bearer ${token}` }
            }).catch(() => ({ ok: false }))
          ]);

          if (uRes.status === 401) {
            handleLogout();
            return;
          }

          if (uRes.ok) {
            const uData = await uRes.json();
            setUsers(uData);
          }

          if (whRes && whRes.ok) {
            const whData = await whRes.json();
            setWarehouses(Array.isArray(whData) ? whData : []);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoadingUsers(false);
        }
      };

      useEffect(() => {
        if (token) {
          fetchDirectory();
        }
      }, [token, roleFilter, warehouseFilter]);

      const handleAddEmployee = async (e) => {
        e.preventDefault();
        setAddError(null);

        if (addForm.password.length < 8) {
          setAddError('Temporary password must be at least 8 characters long.');
          return;
        }

        setAddSubmitting(true);
        try {
          const payload = {
            name: addForm.name.trim(),
            email: addForm.email.trim(),
            password: addForm.password,
            role: addForm.role,
            warehouse_id: addForm.warehouse_id ? parseInt(addForm.warehouse_id, 10) : null
          };

          const res = await fetch(`${API_BASE_URL}/users`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Failed to create user');

          triggerToast(`Account provisioned for ${payload.name}!`);
          setShowAddModal(false);
          setAddForm({
            name: '',
            email: '',
            password: '',
            role: 'warehouse_staff',
            warehouse_id: ''
          });
          fetchDirectory();
        } catch (err) {
          setAddError(err.message);
        } finally {
          setAddSubmitting(false);
        }
      };

      const handleAdminReset = async (e) => {
        e.preventDefault();
        setResetError(null);

        if (resetPasswordVal.length < 8) {
          setResetError('New password must be at least 8 characters long.');
          return;
        }

        setResetSubmitting(true);
        try {
          const res = await fetch(`${API_BASE_URL}/users/${resetTargetUser.id}/reset-password`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ new_password: resetPasswordVal })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Reset failed');

          triggerToast(`Password reset for ${resetTargetUser.name}!`);
          setResetTargetUser(null);
          setResetPasswordVal('');
        } catch (err) {
          setResetError(err.message);
        } finally {
          setResetSubmitting(false);
        }
      };

      const handleChangeSelfPassword = async (e) => {
        e.preventDefault();
        setCpError(null);

        if (cpNewPass.length < 8) {
          setCpError('New password must be at least 8 characters long.');
          return;
        }

        if (cpNewPass !== cpConfirmPass) {
          setCpError('New password and confirmation do not match.');
          return;
        }

        setCpSubmitting(true);
        try {
          const res = await fetch(`${API_BASE_URL}/auth/change-password`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              old_password: cpOldPass,
              new_password: cpNewPass
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Password change failed');

          triggerToast('Your password was updated successfully!');
          setShowChangePasswordModal(false);
          setCpOldPass('');
          setCpNewPass('');
          setCpConfirmPass('');
        } catch (err) {
          setCpError(err.message);
        } finally {
          setCpSubmitting(false);
        }
      };

      const filtered = users.filter((u) => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
      });

      if (!token) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
              <div className="flex items-center gap-3 mb-6">
                <div className="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30 font-black text-xl">
                  SG
                </div>
                <div>
                  <h2 className="text-xl font-bold text-white tracking-tight">StockGuard Enterprise</h2>
                  <p className="text-xs text-slate-400">DBMS Access Control & Inventory</p>
                </div>
              </div>

              {loginError && (
                <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm rounded-xl">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
                    Corporate Email
                  </label>
                  <input
                    type="email"
                    required
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
                    Password
                  </label>
                  <input
                    type="password"
                    required
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <button
                  type="submit"
                  disabled={loginLoading}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition-all text-sm flex items-center justify-center gap-2"
                >
                  {loginLoading ? 'Authenticating...' : 'Sign In to Portal'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl border text-sm flex items-center gap-3 ${
              toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-800' : 'bg-emerald-950/90 text-emerald-200 border-emerald-800'
            }`}>
              <span className="w-2 h-2 rounded-full bg-current animate-ping" />
              {toast.msg}
            </div>
          )}

          {/* Top Navbar */}
          <header className="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-600/30">
                  SG
                </div>
                <div>
                  <span className="font-bold text-white text-base tracking-tight">StockGuard</span>
                  <span className="ml-2 text-xs text-indigo-400 font-semibold px-2 py-0.5 rounded-md bg-indigo-500/10 border border-indigo-500/20">
                    Enterprise Portal
                  </span>
                </div>
              </div>

              {/* Profile Avatar & Dropdown */}
              <div className="relative">
                <button
                  onClick={() => setShowUserDropdown(!showUserDropdown)}
                  className="flex items-center gap-2.5 p-1.5 rounded-xl hover:bg-slate-800/80 transition-colors"
                >
                  <div className="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-300 font-semibold flex items-center justify-center text-xs border border-indigo-500/30">
                    {currentUser?.name?.charAt(0).toUpperCase() || 'U'}
                  </div>
                  <div className="text-left hidden md:block">
                    <p className="text-xs font-semibold text-white leading-tight">{currentUser?.name}</p>
                    <p className="text-[10px] text-slate-400 leading-tight uppercase font-medium">{currentUser?.role}</p>
                  </div>
                </button>

                {showUserDropdown && (
                  <div className="absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl py-2 z-50 animate-in fade-in zoom-in-95 duration-100">
                    <div className="px-4 py-2 border-b border-slate-800/60">
                      <p className="text-xs font-semibold text-white truncate">{currentUser?.name}</p>
                      <p className="text-[11px] text-slate-400 truncate">{currentUser?.email}</p>
                    </div>
                    <button
                      onClick={() => {
                        setShowUserDropdown(false);
                        setShowChangePasswordModal(true);
                      }}
                      className="w-full text-left px-4 py-2.5 text-xs text-slate-200 hover:bg-slate-800 flex items-center gap-2 transition-colors"
                    >
                      <span className="text-indigo-400">🔒</span> Change Password
                    </button>
                    <button
                      onClick={handleLogout}
                      className="w-full text-left px-4 py-2.5 text-xs text-rose-400 hover:bg-rose-500/10 flex items-center gap-2 transition-colors"
                    >
                      <span>🚪</span> Sign Out
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">
            {/* Header + Add button */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl font-bold text-white tracking-tight">Staff Accounts & Access Management</h1>
                <p className="text-sm text-slate-400">
                  Manage administrative permissions, assign facility warehouses, and securely provision credentials.
                </p>
              </div>
              <button
                onClick={() => setShowAddModal(true)}
                className="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition-all self-start sm:self-auto"
              >
                + Add Employee
              </button>
            </div>

            {/* Quick Metrics */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl">
                <span className="text-xs text-slate-400 font-medium">Total Provisioned Staff</span>
                <p className="text-2xl font-bold text-white mt-1">{users.length}</p>
              </div>
              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl">
                <span className="text-xs text-purple-400 font-medium">Administrators</span>
                <p className="text-2xl font-bold text-white mt-1">{users.filter(u => u.role === 'admin').length}</p>
              </div>
              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl">
                <span className="text-xs text-amber-400 font-medium">Warehouse Staff</span>
                <p className="text-2xl font-bold text-white mt-1">{users.filter(u => u.role === 'warehouse_staff').length}</p>
              </div>
              <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl">
                <span className="text-xs text-emerald-400 font-medium">Delivery Agents</span>
                <p className="text-2xl font-bold text-white mt-1">{users.filter(u => u.role === 'delivery_agent').length}</p>
              </div>
            </div>

            {/* Filters */}
            <div className="bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl flex flex-col md:flex-row gap-3 items-center justify-between">
              <input
                type="text"
                placeholder="Search staff by name or email..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full md:w-80 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />

              <div className="flex items-center gap-3 w-full md:w-auto">
                <select
                  value={roleFilter}
                  onChange={(e) => setRoleFilter(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="">All Roles</option>
                  {ROLES.map(r => (
                    <option key={r.value} value={r.value}>{r.label}</option>
                  ))}
                </select>

                <button
                  onClick={fetchDirectory}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm rounded-xl transition-colors"
                >
                  Refresh
                </button>
              </div>
            </div>

            {/* Table */}
            <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm text-slate-300">
                  <thead className="bg-slate-950 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
                    <tr>
                      <th className="px-6 py-4">Employee</th>
                      <th className="px-6 py-4">Role</th>
                      <th className="px-6 py-4">Warehouse Facility</th>
                      <th className="px-6 py-4">Enrolled Date</th>
                      <th className="px-6 py-4 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {loadingUsers ? (
                      <tr>
                        <td colSpan="5" className="px-6 py-12 text-center text-slate-500">
                          Loading active employees...
                        </td>
                      </tr>
                    ) : filtered.length === 0 ? (
                      <tr>
                        <td colSpan="5" className="px-6 py-12 text-center text-slate-500">
                          No employee accounts found matching criteria.
                        </td>
                      </tr>
                    ) : (
                      filtered.map((user) => {
                        const roleObj = ROLES.find(r => r.value === user.role) || { label: user.role, badge: 'bg-slate-800 text-slate-300 border-slate-700' };
                        return (
                          <tr key={user.id} className="hover:bg-slate-800/40 transition-colors">
                            <td className="px-6 py-4 whitespace-nowrap">
                              <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-indigo-500/10 text-indigo-400 font-semibold flex items-center justify-center border border-indigo-500/20 text-sm">
                                  {user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                  <div className="font-medium text-white">{user.name}</div>
                                  <div className="text-xs text-slate-500">{user.email}</div>
                                </div>
                              </div>
                            </td>
                            <td className="px-6 py-4 whitespace-nowrap">
                              <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${roleObj.badge}`}>
                                {roleObj.label}
                              </span>
                            </td>
                            <td className="px-6 py-4 whitespace-nowrap">
                              {user.warehouse_id ? (
                                <span className="text-xs text-slate-300 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700/60">
                                  Facility #{user.warehouse_id}
                                </span>
                              ) : (
                                <span className="text-xs text-slate-500 italic">Global Headquarter</span>
                              )}
                            </td>
                            <td className="px-6 py-4 whitespace-nowrap text-xs text-slate-400">
                              {new Date(user.created_at).toLocaleDateString(undefined, {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric',
                              })}
                            </td>
                            <td className="px-6 py-4 whitespace-nowrap text-right">
                              <button
                                onClick={() => setResetTargetUser(user)}
                                className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-amber-400 hover:text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 rounded-lg transition-colors"
                              >
                                Reset Password
                              </button>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Add Employee Modal */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
                <div className="px-6 py-5 border-b border-slate-800 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Provision New Employee</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAddEmployee} className="p-6 space-y-4">
                  {addError && (
                    <div className="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm rounded-xl">
                      {addError}
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-medium uppercase text-slate-400 mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. David Miller"
                      value={addForm.name}
                      onChange={(e) => setAddForm({ ...addForm, name: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium uppercase text-slate-400 mb-1">Corporate Email</label>
                    <input
                      type="email"
                      required
                      placeholder="e.g. david.miller@stockguard.test"
                      value={addForm.email}
                      onChange={(e) => setAddForm({ ...addForm, email: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium uppercase text-slate-400 mb-1">Assigned Role</label>
                      <select
                        value={addForm.role}
                        onChange={(e) => setAddForm({ ...addForm, role: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        {ROLES.map(r => (
                          <option key={r.value} value={r.value}>{r.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-medium uppercase text-slate-400 mb-1">Warehouse Facility ID</label>
                      <input
                        type="number"
                        placeholder="Optional (e.g. 1)"
                        value={addForm.warehouse_id}
                        onChange={(e) => setAddForm({ ...addForm, warehouse_id: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-medium uppercase text-slate-400 mb-1">Initial Temporary Password</label>
                    <input
                      type="password"
                      required
                      minLength={8}
                      placeholder="Minimum 8 characters"
                      value={addForm.password}
                      onChange={(e) => setAddForm({ ...addForm, password: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 text-sm text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={addSubmitting}
                      className="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl shadow-lg shadow-indigo-600/30"
                    >
                      {addSubmitting ? 'Provisioning...' : 'Provision Account'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Admin Reset Password Modal */}
          {resetTargetUser && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
                <div className="px-6 py-5 border-b border-slate-800 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Reset Employee Password</h3>
                  <button onClick={() => setResetTargetUser(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAdminReset} className="p-6 space-y-4">
                  {resetError && (
                    <div className="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm rounded-xl">
                      {resetError}
                    </div>
                  )}

                  <p className="text-xs text-slate-400">
                    Target User: <strong className="text-white">{resetTargetUser.name}</strong> ({resetTargetUser.email})
                  </p>

                  <div>
                    <label className="block text-xs font-medium uppercase text-slate-400 mb-1">New Password (min 8 chars)</label>
                    <input
                      type="password"
                      required
                      minLength={8}
                      value={resetPasswordVal}
                      onChange={(e) => setResetPasswordVal(e.target.value)}
                      placeholder="Enter new credential"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setResetTargetUser(null)}
                      className="px-4 py-2 text-sm text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={resetSubmitting}
                      className="px-5 py-2 text-sm font-medium text-white bg-amber-600 hover:bg-amber-500 rounded-xl shadow-lg shadow-amber-600/30"
                    >
                      {resetSubmitting ? 'Overriding...' : 'Reset Password'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Self Change Password Modal */}
          {showChangePasswordModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
                <div className="px-6 py-5 border-b border-slate-800 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Change Password</h3>
                  <button onClick={() => setShowChangePasswordModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleChangeSelfPassword} className="p-6 space-y-4">
                  {cpError && (
                    <div className="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm rounded-xl">
                      {cpError}
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-medium uppercase text-slate-400 mb-1">Current Password</label>
                    <input
                      type="password"
                      required
                      value={cpOldPass}
                      onChange={(e) => setCpOldPass(e.target.value)}
                      placeholder="Enter current password"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium uppercase text-slate-400 mb-1">New Password (min 8 chars)</label>
                    <input
                      type="password"
                      required
                      minLength={8}
                      value={cpNewPass}
                      onChange={(e) => setCpNewPass(e.target.value)}
                      placeholder="Enter new strong password"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium uppercase text-slate-400 mb-1">Confirm New Password</label>
                    <input
                      type="password"
                      required
                      value={cpConfirmPass}
                      onChange={(e) => setCpConfirmPass(e.target.value)}
                      placeholder="Re-type new password"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowChangePasswordModal(false)}
                      className="px-4 py-2 text-sm text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={cpSubmitting}
                      className="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl shadow-lg shadow-indigo-600/30"
                    >
                      {cpSubmitting ? 'Updating...' : 'Save Password'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
